<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Off The Glass</title>
<style>
  :root { --bg: #ffffff; --fg: #111111; --muted: #666666; --box: #f2f2f2; --btn: #111111; --btnfg: #ffffff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0e0e0e; --fg: #f2f2f2; --muted: #a0a0a0; --box: #1c1c1c; --btn: #f2f2f2; --btnfg: #111111; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 18px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  main { max-width: 480px; margin: 0 auto; padding: 48px 16px; }
  h1 { font-size: 24px; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0 0 20px; }
  #code { background: var(--box); border-radius: 12px; padding: 16px; font: 15px/1.4 ui-monospace, Menlo, monospace; word-break: break-all; margin-bottom: 16px; }
  button { width: 100%; padding: 16px; border: 0; border-radius: 12px; background: var(--btn); color: var(--btnfg); font-size: 18px; font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1 id="title">Almost done</h1>
  <p id="msg">Copy this code and text it to Dylan. It works for one hour.</p>
  <div id="code"></div>
  <button id="copy">Copy code</button>
</main>
<script>
  var q = new URLSearchParams(location.search);
  var code = (q.get("code") || "").replace(/#_$/, "");
  var codeEl = document.getElementById("code"), btn = document.getElementById("copy");
  if (q.get("error")) {
    document.getElementById("title").textContent = "No problem";
    document.getElementById("msg").textContent = "Nothing was connected. Tap the link again whenever you're ready.";
    codeEl.remove(); btn.remove();
  } else if (!code) {
    document.getElementById("title").textContent = "Off The Glass";
    document.getElementById("msg").textContent = "Open this page from the link Dylan sent you.";
    codeEl.remove(); btn.remove();
  } else {
    codeEl.textContent = code;
    btn.onclick = function () {
      navigator.clipboard.writeText(code).then(function () { btn.textContent = "Copied. Now text it to Dylan."; },
        function () { btn.textContent = "Press and hold the code to copy it"; });
    };
  }
</script>
</body>
</html>
